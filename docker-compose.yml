# Token-free boleta scanner — Postgres + OCR worker (Tesseract) + pgAdmin + backup.
# OCR engine is Tesseract (container-friendly); openclaw POSTs photos to the
# worker at http://worker:8000/ocr (or localhost:8000 from the host).
# See docs/03-architecture.md.

services:
  worker:
    build: ./worker
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres        # reach Postgres over the compose network
      IMAGE_STORE: /app/data/images
    ports:
      - "${OCR_PORT:-8002}:8000"
    volumes:
      - ./data/images:/app/data/images
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_RO_USER: ${POSTGRES_RO_USER:-fortunia_ro}
      POSTGRES_RO_PASSWORD: ${POSTGRES_RO_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # DDL + seed + rol read-only run once, on first cluster init, in filename order:
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./db/03_ro_role.sh:/docker-entrypoint-initdb.d/03_ro_role.sh:ro
      - ./db/04_text_seed.sql:/docker-entrypoint-initdb.d/04_text_seed.sql:ro
      - ./db/05_incomes.sql:/docker-entrypoint-initdb.d/05_incomes.sql:ro
      - ./db/06_fund.sql:/docker-entrypoint-initdb.d/06_fund.sql:ro
      - ./db/07_fund_payments.sql:/docker-entrypoint-initdb.d/07_fund_payments.sql:ro
      - ./db/08_ocr_fund.sql:/docker-entrypoint-initdb.d/08_ocr_fund.sql:ro
      - ./db/09_admin_soft_delete.sql:/docker-entrypoint-initdb.d/09_admin_soft_delete.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  dashboard:
    build: ./dashboard
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres        # reach Postgres over the compose network
      IMAGE_STORE: /app/data/images
    ports:
      - "${DASHBOARD_PORT:-8001}:8000"
    volumes:
      - ./data/images:/app/data/images:ro   # read-only: el dashboard sólo muestra imágenes
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy

  backup:
    build: ./backup
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres        # red de compose
      BACKUP_DIR: /backups           # ruta interna; el host la monta al disco externo
      IMAGE_STORE: /app/data/images
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./data/images:/app/data/images        # rw: respaldar y restaurar imágenes
    # SIN 'ports': servicio privilegiado, solo alcanzable por la red de compose
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
