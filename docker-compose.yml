# Token-free boleta scanner — Postgres + OCR worker (Tesseract) + pgAdmin + backup.
# OCR engine is Tesseract (container-friendly); openclaw POSTs photos to the
# worker at http://worker:8000/ocr (or localhost:8000 from the host).
# See docs/03-architecture.md.

services:
  worker:
    build: ./worker
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres        # reach Postgres over the compose network
      IMAGE_STORE: /app/data/images
    ports:
      - "${OCR_PORT:-8002}:8000"
    volumes:
      - ./data/images:/app/data/images
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # DDL + seed run once, on first cluster init, in filename order:
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy

  db-backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PGHOST: postgres
    volumes:
      - ./backups:/backups
    # nightly pg_dump; prune dumps older than 30 days
    entrypoint: >
      bash -c "while true; do
        sleep 86400;
        pg_dump | gzip > /backups/$$(date +%%Y%%m%%d-%%H%%M%%S).sql.gz;
        find /backups -name '*.sql.gz' -mtime +30 -delete;
      done"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
