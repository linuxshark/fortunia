<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}fortunia · gastos{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/vendor/pico.min.css">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/vendor/htmx.min.js"></script>
  <script src="/static/vendor/chart.umd.min.js"></script>
  <script>
    if (window.Chart) {
      Chart.defaults.color = '#7a756d';
      Chart.defaults.borderColor = 'rgba(255,255,255,0.06)';
    }
  </script>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<script>
(function () {
  var cv = document.getElementById('bg-canvas');
  var ctx = cv.getContext('2d');
  var mouse = { x: null, y: null };
  var pts = [];
  var N = 80;
  var LINK = 130;
  var MLINK = 190;

  function resize() {
    cv.width = window.innerWidth;
    cv.height = window.innerHeight;
  }

  function Pt() {
    this.x = Math.random() * cv.width;
    this.y = Math.random() * cv.height;
    this.vx = (Math.random() - 0.5) * 0.35;
    this.vy = (Math.random() - 0.5) * 0.35;
    this.r = Math.random() * 1.2 + 0.4;
  }
  Pt.prototype.tick = function () {
    this.x += this.vx; this.y += this.vy;
    if (this.x < 0 || this.x > cv.width)  this.vx *= -1;
    if (this.y < 0 || this.y > cv.height) this.vy *= -1;
  };

  function loop() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (var i = 0; i < pts.length; i++) {
      var p = pts[i];
      p.tick();
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.fill();

      for (var j = i + 1; j < pts.length; j++) {
        var q = pts[j];
        var dx = p.x - q.x, dy = p.y - q.y;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d < LINK) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y);
          ctx.strokeStyle = 'rgba(255,255,255,' + ((1 - d / LINK) * 0.09) + ')';
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }

      if (mouse.x !== null) {
        var mx = p.x - mouse.x, my = p.y - mouse.y;
        var md = Math.sqrt(mx * mx + my * my);
        if (md < MLINK) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y); ctx.lineTo(mouse.x, mouse.y);
          ctx.strokeStyle = 'rgba(52,211,153,' + ((1 - md / MLINK) * 0.35) + ')';
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(loop);
  }

  resize();
  for (var i = 0; i < N; i++) pts.push(new Pt());
  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', function (e) { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('mouseleave', function () { mouse.x = null; mouse.y = null; });
  loop();
})();
</script>
  <nav class="container-fluid topbar">
    <ul>
      <li><a href="/" class="brand"><strong>fortunia</strong> <span class="muted">gastos</span></a></li>
    </ul>
    <ul>
      <li><a href="/">Resumen</a></li>
      <li><a href="/expenses">Gastos</a></li>
      <li><a href="/incomes">Ingresos</a></li>
    </ul>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="container muted">
    <small>fortunia dashboard · solo lectura · puerto 8001</small>
  </footer>
</body>
</html>
